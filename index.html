<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢乐答题大挑战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }
  .bubble {
    position: fixed; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    animation: float 6s ease-in-out infinite; pointer-events: none;
  }
  .bubble:nth-child(1){width:80px;height:80px;top:10%;left:8%;animation-delay:0s}
  .bubble:nth-child(2){width:50px;height:50px;top:70%;left:12%;animation-delay:1.5s}
  .bubble:nth-child(3){width:100px;height:100px;top:20%;right:10%;animation-delay:0.8s}
  .bubble:nth-child(4){width:40px;height:40px;top:75%;right:15%;animation-delay:2s}
  .bubble:nth-child(5){width:60px;height:60px;top:45%;left:5%;animation-delay:1s}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-25px) rotate(10deg)}}
  .container {
    background: #fff; border-radius: 28px; padding: 28px 24px;
    width: 100%; max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 0 6px rgba(255,255,255,0.2);
    position: relative; animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn{from{opacity:0;transform:scale(0.8) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .sound-toggle {
    position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
    background:#f0f0f0;border:2px solid #e0e0e0;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;transition:all 0.2s;z-index:10;
  }
  .sound-toggle:hover{background:#e0e0e0;transform:scale(1.1)}
  .sound-toggle.off{opacity:0.5}

  /* 开始页 */
  .start-page { text-align: center; }
  .start-page .title {
    font-size: 32px; font-weight: bold;
    background: linear-gradient(135deg, #667eea, #f093fb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .start-page .subtitle { color: #999; font-size: 14px; margin-bottom: 24px; }
  .start-page .mascot { font-size: 64px; margin-bottom: 16px; animation: bounce 2s infinite; }
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .difficulty-label { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 12px; }
  .difficulty-cards { display: flex; gap: 10px; margin-bottom: 20px; }
  .diff-card {
    flex: 1; padding: 16px 8px; border-radius: 16px; cursor: pointer;
    border: 3px solid #eee; transition: all 0.25s; text-align: center;
  }
  .diff-card:hover { transform: translateY(-3px); }
  .diff-card.selected { border-color: #667eea; background: #f0f0ff; transform: translateY(-3px); }
  .diff-card .emoji { font-size: 28px; margin-bottom: 6px; }
  .diff-card .name { font-size: 14px; font-weight: bold; color: #333; }
  .diff-card .desc { font-size: 11px; color: #999; margin-top: 4px; }
  .start-btn {
    width: 100%; padding: 16px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s;
    box-shadow: 0 8px 25px rgba(102,126,234,0.4);
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(102,126,234,0.5); }
  .start-btn:active { transform: translateY(0); }
  .view-lb-btn {
    display:inline-block;margin-top:14px;padding:8px 20px;border:none;border-radius:20px;
    background:#f0f0f0;color:#666;font-size:13px;cursor:pointer;transition:all 0.2s;
  }
  .view-lb-btn:hover{background:#e0e0e0}

  /* 答题页 */
  .quiz-page { display: none; }
  .game-info {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; font-size: 13px; font-weight: bold;
  }
  .lives { font-size: 18px; letter-spacing: 2px; }
  .combo-display {
    text-align: center; font-size: 14px; font-weight: bold; color: #ff6b6b;
    margin-bottom: 10px; height: 20px; transition: all 0.3s;
  }
  .combo-display.show { animation: comboPop 0.4s ease; }
  @keyframes comboPop{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
  .progress-bar { width:100%;height:10px;background:#eee;border-radius:5px;margin-bottom:14px;overflow:hidden; }
  .progress-fill {
    height:100%;background:linear-gradient(90deg,#667eea,#f093fb);border-radius:5px;
    transition:width 0.4s ease;width:0%;
  }
  .timer-box {
    background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;
    padding:5px 14px;border-radius:20px;font-size:13px;
  }
  .timer-box.warning{background:linear-gradient(135deg,#ff6b6b,#ee5a5a);animation:pulse 0.6s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .question {
    font-size: 20px; font-weight: bold; margin-bottom: 20px; line-height: 1.6;
    color: #2d3436; text-align: center; min-height: 60px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    padding: 14px 18px; border: 3px solid #eee; border-radius: 14px;
    cursor: pointer; transition: all 0.25s; font-size: 15px; background: #fafafa;
    color: #333; display: flex; align-items: center; gap: 10px; font-weight: 500;
  }
  .option .letter {
    width: 28px; height: 28px; border-radius: 50%; background: #e0e0e0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold; color: #666; flex-shrink: 0; transition: all 0.25s;
  }
  .option:hover { border-color: #667eea; background: #f0f0ff; transform: translateX(3px); }
  .option:hover .letter { background: #667eea; color: #fff; }
  .option.correct { border-color: #26de81; background: #e8f8ef; color: #20bf6b; animation: correctBounce 0.5s; }
  .option.correct .letter { background: #26de81; color: #fff; }
  @keyframes correctBounce{0%{transform:scale(1)}30%{transform:scale(1.04)}60%{transform:scale(0.98)}100%{transform:scale(1)}}
  .option.wrong { border-color: #fc5c65; background: #fdecea; color: #eb3b5a; animation: wrongShake 0.4s; }
  .option.wrong .letter { background: #fc5c65; color: #fff; }
  @keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .option.disabled { pointer-events: none; }

  /* 结果页 */
  .result-page { display: none; text-align: center; animation: popIn 0.5s; }
  .result-page .big-emoji { font-size: 64px; margin-bottom: 8px; animation: bounce 1.5s infinite; }
  .result-page h2 { font-size: 24px; color: #333; margin-bottom: 4px; }
  .result-page .sub { color: #999; font-size: 13px; margin-bottom: 18px; }
  .score-display {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    border-radius: 20px; padding: 24px 16px; margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .score-display::before{content:'✨';position:absolute;top:8px;right:12px;font-size:18px;animation:sparkle 1.5s infinite}
  .score-display::after{content:'⭐';position:absolute;bottom:8px;left:12px;font-size:16px;animation:sparkle 1.5s infinite 0.5s}
  @keyframes sparkle{0%,100%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:0.5;transform:scale(1.3) rotate(15deg)}}
  .score-label { font-size: 13px; color: rgba(255,255,255,0.8); font-weight: bold; margin-bottom: 4px; }
  .score-num { font-size: 48px; font-weight: bold; color: #fff; }
  .score-num .total { font-size: 20px; opacity: 0.7; }
  .rank-tag {
    display: inline-block; padding: 6px 20px; border-radius: 20px;
    font-size: 14px; font-weight: bold; margin-bottom: 14px; color: #fff;
  }
  .rank-s{background:linear-gradient(135deg,#ffd700,#ff8c00)}
  .rank-a{background:linear-gradient(135deg,#a29bfe,#6c5ce7)}
  .rank-b{background:linear-gradient(135deg,#55efc4,#00b894)}
  .rank-c{background:linear-gradient(135deg,#fdcb6e,#e17055)}
  .comment { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 14px; padding: 0 8px; }

  /* 保存成绩 */
  .save-score {
    background: #f8f8ff; border: 2px dashed #c0c0ff; border-radius: 14px;
    padding: 14px; margin-bottom: 14px;
  }
  .save-score p { font-size: 13px; color: #667eea; margin-bottom: 8px; font-weight: bold; }
  .save-score input {
    width: 100%; padding: 10px 14px; border: 2px solid #e0e0ff; border-radius: 10px;
    font-size: 14px; outline: none; transition: border-color 0.2s; font-family: inherit;
  }
  .save-score input:focus { border-color: #667eea; }
  .save-score .save-btn {
    margin-top: 8px; width: 100%; padding: 10px;
    background: linear-gradient(135deg,#667eea,#764ba2); color: #fff;
    border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .save-score .save-btn:hover { transform: translateY(-1px); }
  .saved-tip { font-size: 13px; color: #20bf6b; margin-top: 6px; font-weight: bold; }

  /* 成就 */
  .achievements { margin-bottom: 14px; }
  .ach-title { font-size: 13px; font-weight: bold; color: #999; margin-bottom: 8px; }
  .ach-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .ach-item {
    padding: 5px 10px; border-radius: 10px; font-size: 12px; font-weight: bold;
    background: #f0f0f0; color: #999; display: flex; align-items: center; gap: 3px;
  }
  .ach-item.unlocked { background: linear-gradient(135deg,#ffd700,#ff8c00); color: #fff; animation: achPop 0.5s; }
  @keyframes achPop{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}

  .btn-group { display: flex; gap: 8px; }
  .btn-group button {
    flex: 1; padding: 13px 10px; border: none; border-radius: 14px;
    font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.25s;
  }
  .btn-primary { background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; box-shadow: 0 6px 20px rgba(102,126,234,0.35); }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-secondary { background: #f0f0f0; color: #666; }
  .btn-secondary:hover { background: #e0e0e0; }

  /* 弹窗通用 */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center;
    padding: 20px; animation: fadeIn 0.3s;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal {
    background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 380px;
    max-height: 85vh; overflow-y: auto; text-align: center; animation: popIn 0.4s;
  }
  .modal h3 { font-size: 20px; color: #333; margin-bottom: 6px; }
  .modal .modal-sub { color: #999; font-size: 12px; margin-bottom: 16px; }

  /* 排行榜 */
  .leaderboard-list { list-style: none; text-align: left; }
  .leaderboard-item {
    display: flex; align-items: center; padding: 10px 12px; border-radius: 10px;
    margin-bottom: 6px; background: #f8f8ff; transition: all 0.2s;
  }
  .leaderboard-item:hover { transform: translateX(3px); }
  .leaderboard-item.top1 { background: linear-gradient(135deg,#fff9e6,#fff3cd); border:1px solid #ffd700; }
  .leaderboard-item.top2 { background: linear-gradient(135deg,#f5f6fa,#e8e8e8); border:1px solid #c0c0c0; }
  .leaderboard-item.top3 { background: linear-gradient(135deg,#fef0e6,#fde0cc); border:1px solid #cd7f32; }
  .lb-rank {
    width: 28px; height: 28px; border-radius: 50%; background: #e0e0ff; color: #667eea;
    display: flex; align-items: center; justify-content: center; font-weight: bold;
    font-size: 13px; margin-right: 10px; flex-shrink: 0;
  }
  .top1 .lb-rank { background: #ffd700; color: #fff; font-size: 16px; }
  .top2 .lb-rank { background: #c0c0c0; color: #fff; font-size: 16px; }
  .top3 .lb-rank { background: #cd7f32; color: #fff; font-size: 16px; }
  .lb-name { flex: 1; font-size: 14px; font-weight: 500; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { font-size: 15px; font-weight: bold; color: #667eea; }
  .lb-diff { font-size: 10px; color: #999; margin-left: 6px; }
  .empty-board { text-align: center; padding: 30px 16px; color: #999; font-size: 14px; }
  .empty-board .big { font-size: 42px; margin-bottom: 8px; }
  .modal button {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: linear-gradient(135deg,#667eea,#764ba2); color: #fff;
    font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px;
  }
  .modal .close-btn { background: #f0f0f0; color: #666; margin-top: 6px; }
  .modal .clear-btn { background: transparent; color: #bbb; font-size: 12px; text-decoration: underline; margin-top: 4px; box-shadow: none; }

  /* 海报 */
  #posterCanvas { width: 100%; border-radius: 12px; margin-bottom: 10px; }
  .modal-tip { font-size: 12px; color: #999; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>

<div class="container">
  <div class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</div>

  <!-- 开始页 -->
  <div class="start-page" id="startPage">
    <div class="mascot">🎯</div>
    <div class="title">欢乐答题大挑战</div>
    <div class="subtitle">10道题 · 3条命 · 看你能拿多少分！</div>
    <div class="difficulty-label">选择难度</div>
    <div class="difficulty-cards">
      <div class="diff-card selected" data-diff="easy" onclick="selectDiff(this)">
        <div class="emoji">🌱</div><div class="name">简单</div><div class="desc">新手友好</div>
      </div>
      <div class="diff-card" data-diff="medium" onclick="selectDiff(this)">
        <div class="emoji">🔥</div><div class="name">中等</div><div class="desc">有点挑战</div>
      </div>
      <div class="diff-card" data-diff="hard" onclick="selectDiff(this)">
        <div class="emoji">💀</div><div class="name">困难</div><div class="desc">大神专属</div>
      </div>
    </div>
    <button class="start-btn" onclick="startGame()">开始挑战 🚀</button>
    <br>
    <button class="view-lb-btn" onclick="showLeaderboard()">🏆 查看排行榜</button>
  </div>

  <!-- 答题页 -->
  <div class="quiz-page" id="quizPage">
    <div class="game-info">
      <span class="lives" id="lives">❤️❤️❤️</span>
      <span id="qProgress">第 1/10 题</span>
      <span class="timer-box" id="timerBox">⏱ 15s</span>
    </div>
    <div class="combo-display" id="comboDisplay"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
  </div>

  <!-- 结果页 -->
  <div class="result-page" id="resultPage">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">挑战完成！</h2>
    <div class="sub" id="resultSub">来看看你的战绩吧~</div>
    <div class="score-display">
      <div class="score-label">最终得分</div>
      <div class="score-num"><span id="finalScore">0</span><span class="total"> 分</span></div>
    </div>
    <div class="rank-tag" id="rankBadge"></div>
    <div class="comment" id="comment"></div>

    <div class="save-score" id="saveScoreBox">
      <p>🏆 输入昵称，登上排行榜！</p>
      <input type="text" id="playerName" placeholder="请输入昵称（最多8个字）" maxlength="8">
      <button class="save-btn" onclick="saveScore()">保存到排行榜</button>
    </div>

    <div class="achievements" id="achSection">
      <div class="ach-title">🏅 获得成就</div>
      <div class="ach-list" id="achList"></div>
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="restart()">🔄 再来一局</button>
      <button class="btn-secondary" onclick="showLeaderboard()">🏆 排行榜</button>
    </div>
    <div class="btn-group" style="margin-top:8px">
      <button class="btn-secondary" onclick="showPoster()" style="flex:1">📸 生成海报</button>
    </div>
  </div>
</div>

<!-- 排行榜弹窗 -->
<div class="modal-overlay" id="leaderboardModal">
  <div class="modal">
    <h3>🏆 排行榜</h3>
    <div class="modal-sub">本地成绩 · 前10名</div>
    <ul class="leaderboard-list" id="leaderboardList"></ul>
    <button onclick="closeLeaderboard()">关闭</button>
    <button class="clear-btn" onclick="clearLeaderboard()">清空排行榜</button>
  </div>
</div>

<!-- 海报弹窗 -->
<div class="modal-overlay" id="posterModal">
  <div class="modal">
    <h3>📸 你的成绩海报</h3>
    <canvas id="posterCanvas" width="600" height="800"></canvas>
    <div class="modal-tip">长按图片保存，分享给朋友吧！</div>
    <button onclick="downloadPoster()">💾 保存图片</button>
    <button class="close-btn" onclick="closePoster()">关闭</button>
  </div>
</div>

<script>
// ==================== 题库 ====================
const questionBank = {
  easy: [
    { q: "太阳从哪个方向升起？", opts: ["东方","西方","南方","北方"], a: 0 },
    { q: "一年有多少个月？", opts: ["10个","11个","12个","13个"], a: 2 },
    { q: "大熊猫最喜欢吃什么？", opts: ["竹子","肉","鱼","水果"], a: 0 },
    { q: "水在多少度会结冰？", opts: ["0度","10度","100度","-10度"], a: 0 },
    { q: "彩虹有几种颜色？", opts: ["5种","6种","7种","8种"], a: 2 },
    { q: "一周有几天？", opts: ["5天","6天","7天","8天"], a: 2 },
    { q: "猫喜欢吃什么？", opts: ["胡萝卜","鱼","苹果","面包"], a: 1 },
    { q: "地球是圆的还是方的？", opts: ["圆的","方的","三角形","平的"], a: 0 },
  ],
  medium: [
    { q: "中国的首都是哪里？", opts: ["上海","北京","广州","深圳"], a: 1 },
    { q: "《红楼梦》的作者是谁？", opts: ["罗贯中","曹雪芹","吴承恩","施耐庵"], a: 1 },
    { q: "光的速度大约是多少？", opts: ["3万公里/秒","30万公里/秒","300万公里/秒","3000公里/秒"], a: 1 },
    { q: "人体最大的器官是什么？", opts: ["心脏","肝脏","皮肤","大脑"], a: 2 },
    { q: "世界上最长的河流是？", opts: ["长江","亚马逊河","尼罗河","密西西比河"], a: 2 },
    { q: "DNA的中文名称是？", opts: ["核糖核酸","脱氧核糖核酸","氨基酸","脂肪酸"], a: 1 },
    { q: "第一次工业革命始于哪个国家？", opts: ["法国","德国","英国","美国"], a: 2 },
    { q: "圆周率π大约等于多少？", opts: ["2.14","3.14","4.14","5.14"], a: 1 },
  ],
  hard: [
    { q: "量子力学中的'薛定谔的猫'是关于什么的？", opts: ["生物实验","叠加态思想实验","化学反应","天文观测"], a: 1 },
    { q: "《百年孤独》的作者是？", opts: ["马尔克斯","博尔赫斯","聂鲁达","略萨"], a: 0 },
    { q: "人类基因组大约有多少个基因？", opts: ["2千个","2万个","20万个","200万个"], a: 1 },
    { q: "宇宙大爆炸大约发生在多久以前？", opts: ["46亿年","100亿年","138亿年","200亿年"], a: 2 },
    { q: "图灵机是由谁提出的？", opts: ["冯·诺依曼","阿兰·图灵","爱因斯坦","香农"], a: 1 },
    { q: "世界上第一台电子计算机叫什么？", opts: ["UNIVAC","ENIAC","IBM 360","Mark I"], a: 1 },
    { q: "黑洞的边界叫什么？", opts: ["奇点","事件视界","光锥","史瓦西半径"], a: 1 },
    { q: "《论语》是记录谁言行的书？", opts: ["老子","孔子","孟子","庄子"], a: 1 },
  ]
};

// ==================== 游戏状态 ====================
let currentDiff = 'easy';
let questions = [];
let currentIndex = 0;
let score = 0;
let lives = 3;
let timer = null;
let timeLeft = 15;
let soundOn = true;
let combo = 0;
let maxCombo = 0;
let correctCount = 0;
let totalAnswered = 0;
let startTime = 0;
let achievements = [];
let scoreSaved = false;

// ==================== 音效 ====================
let audioCtx = null;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playTone(freq,dur,type='sine',vol=0.25){
  if(!soundOn)return; initAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
function sClick(){playTone(600,0.06,'square',0.12)}
function sCorrect(){playTone(523,0.08,'sine',0.2);setTimeout(()=>playTone(659,0.08,'sine',0.2),70);setTimeout(()=>playTone(784,0.12,'sine',0.2),140)}
function sWrong(){playTone(280,0.12,'sawtooth',0.15);setTimeout(()=>playTone(180,0.2,'sawtooth',0.15),80)}
function sTick(){playTone(900,0.03,'square',0.06)}
function sWin(){[523,587,659,698,784,880,988,1047].forEach((n,i)=>setTimeout(()=>playTone(n,0.12,'sine',0.18),i*70))}
function sCombo(){playTone(880,0.06,'sine',0.15);setTimeout(()=>playTone(1100,0.08,'sine',0.15),50)}
function toggleSound(){
  soundOn=!soundOn;
  const b=document.getElementById('soundToggle');
  b.textContent=soundOn?'🔊':'🔇';b.classList.toggle('off',!soundOn);
  if(soundOn)sClick();
}

// ==================== 难度选择 ====================
function selectDiff(el){
  document.querySelectorAll('.diff-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  currentDiff = el.dataset.diff;
  sClick();
}

// ==================== 开始游戏 ====================
function startGame(){
  sClick();
  const pool = [...questionBank[currentDiff]];
  questions = [];
  const count = Math.min(10, pool.length);
  for(let i=0;i<count;i++){
    const idx = Math.floor(Math.random()*pool.length);
    questions.push(pool.splice(idx,1)[0]);
  }
  currentIndex=0;score=0;lives=3;combo=0;maxCombo=0;correctCount=0;totalAnswered=0;
  startTime=Date.now();achievements=[];scoreSaved=false;
  document.getElementById('startPage').style.display='none';
  document.getElementById('resultPage').style.display='none';
  document.getElementById('quizPage').style.display='block';
  document.getElementById('saveScoreBox').style.display='block';
  document.getElementById('playerName').value='';
  renderQuestion();
}

// ==================== 渲染题目 ====================
function renderQuestion(){
  const q=questions[currentIndex];
  document.getElementById('qProgress').textContent=`第 ${currentIndex+1}/${questions.length} 题`;
  document.getElementById('progressFill').style.width=(currentIndex/questions.length*100)+'%';
  document.getElementById('question').textContent=q.q;
  const od=document.getElementById('options');od.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const d=document.createElement('div');d.className='option';
    d.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;
    d.onclick=()=>{sClick();selectAnswer(i)};
    od.appendChild(d);
  });
  startTimer();
}

// ==================== 倒计时 ====================
function startTimer(){
  timeLeft = currentDiff==='hard'?10:currentDiff==='medium'?12:15;
  const tb=document.getElementById('timerBox');
  tb.textContent=`⏱ ${timeLeft}s`;tb.classList.remove('warning');
  timer=setInterval(()=>{
    timeLeft--;tb.textContent=`⏱ ${timeLeft}s`;
    if(timeLeft<=5){tb.classList.add('warning');sTick()}
    if(timeLeft<=0){clearInterval(timer);selectAnswer(-1)}
  },1000);
}

// ==================== 选择答案 ====================
function selectAnswer(index){
  clearInterval(timer);
  const q=questions[currentIndex];
  const divs=document.querySelectorAll('.option');
  divs.forEach(d=>d.classList.add('disabled'));
  totalAnswered++;

  if(index===q.a){
    divs[index].classList.add('correct');
    correctCount++;combo++;maxCombo=Math.max(maxCombo,combo);
    let base = currentDiff==='hard'?15:currentDiff==='medium'?12:10;
    let bonus = combo>=10?20:combo>=5?10:combo>=3?5:0;
    score += base+bonus;
    sCorrect();
    if(combo>=3){sCombo();showCombo(combo,bonus)}
  }else{
    if(index>=0)divs[index].classList.add('wrong');
    divs[q.a].classList.add('correct');
    lives--;combo=0;
    document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
    sWrong();
    hideCombo();
  }

  setTimeout(()=>{
    currentIndex++;
    if(lives<=0){gameOver('dead')}
    else if(currentIndex>=questions.length){gameOver('complete')}
    else renderQuestion();
  },1100);
}

function showCombo(c,bonus){
  const el=document.getElementById('comboDisplay');
  el.textContent=`🔥 ${c}连击！+${bonus}分`;
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
}
function hideCombo(){document.getElementById('comboDisplay').textContent=''}

// ==================== 游戏结束 ====================
function gameOver(type){
  document.getElementById('quizPage').style.display='none';
  document.getElementById('resultPage').style.display='block';
  document.getElementById('finalScore').textContent=score;
  const elapsed=Math.round((Date.now()-startTime)/1000);
  const avgTime=totalAnswered>0?Math.round(elapsed/totalAnswered):0;

  achievements=[];
  if(correctCount===questions.length)achievements.push({icon:'💯',name:'满分达人'});
  if(maxCombo>=10)achievements.push({icon:'⚡',name:'十连答对'});
  if(avgTime<=3&&totalAnswered>=5)achievements.push({icon:'🚀',name:'速通王者'});
  if(lives===1&&type==='complete')achievements.push({icon:'🛡️',name:'幸存者'});
  if(correctCount>=questions.length*0.8&&lives===3)achievements.push({icon:'👑',name:'无伤通关'});
  if(currentDiff==='hard'&&score>=80)achievements.push({icon:'🏆',name:'困难大师'});

  const emoji=document.getElementById('resultEmoji');
  const title=document.getElementById('resultTitle');
  const sub=document.getElementById('resultSub');
  const badge=document.getElementById('rankBadge');
  const comment=document.getElementById('comment');

  if(type==='dead'){
    emoji.textContent='💀';title.textContent='挑战失败！';
    sub.textContent='生命耗尽，再接再厉！';
  }

  if(score>=120){
    emoji.textContent='🏆';badge.className='rank-tag rank-s';badge.textContent='S级 · 答题之神';
    comment.textContent='我的天！你是行走的百科全书吗？这个分数已经超神了，收下我的膝盖！🙇‍♂️';
    if(type!=='dead'){title.textContent='超神表现！';sub.textContent='你简直是答题界的天花板！'}
  }else if(score>=80){
    emoji.textContent='🌟';badge.className='rank-tag rank-a';badge.textContent='A级 · 学霸附体';
    comment.textContent='厉害厉害！大部分题目都难不倒你，看来平时没少看书，继续保持！💪';
    if(type!=='dead'){title.textContent='优秀！';sub.textContent='你的知识储备很扎实！'}
  }else if(score>=50){
    emoji.textContent='😊';badge.className='rank-tag rank-b';badge.textContent='B级 · 还不错啦';
    comment.textContent='及格啦！虽然有些题翻车了，但整体表现还行，多看看冷知识下次一定更棒~ 📚';
    if(type!=='dead'){title.textContent='挑战完成！';sub.textContent='表现中规中矩，还有提升空间！'}
  }else{
    emoji.textContent='🥺';badge.className='rank-tag rank-c';badge.textContent='C级 · 再接再厉';
    comment.textContent='哎呀，这次不太理想呢~ 不过没关系！谁还没有个知识盲区，再来一局肯定能进步！🌈';
    if(type!=='dead'){title.textContent='挑战完成！';sub.textContent='别灰心，下次一定行！'}
  }

  const achList=document.getElementById('achList');
  if(achievements.length>0){
    document.getElementById('achSection').style.display='block';
    achList.innerHTML=achievements.map(a=>`<div class="ach-item unlocked">${a.icon} ${a.name}</div>`).join('');
  }else{
    document.getElementById('achSection').style.display='none';
  }

  sWin();
}

// ==================== 排行榜 ====================
const LB_KEY = 'quiz_leaderboard_v2';
function getLeaderboard(){
  try{return JSON.parse(localStorage.getItem(LB_KEY))||[]}catch(e){return[]}
}
function saveLeaderboard(list){localStorage.setItem(LB_KEY,JSON.stringify(list))}
function saveScore(){
  const nameInput=document.getElementById('playerName');
  const name=nameInput.value.trim();
  if(!name){nameInput.style.borderColor='#ff6b6b';nameInput.placeholder='⚠️ 请先输入昵称';return}
  if(scoreSaved)return;
  const list=getLeaderboard();
  const diffName=currentDiff==='easy'?'简单':currentDiff==='medium'?'中等':'困难';
  list.push({name,score,diff:diffName,date:new Date().toLocaleDateString()});
  list.sort((a,b)=>b.score-a.score);
  saveLeaderboard(list.slice(0,50));
  scoreSaved=true;
  document.getElementById('saveScoreBox').innerHTML='<div class="saved-tip">✅ 成绩已保存到排行榜！</div>';
  sCorrect();
}
function showLeaderboard(){
  sClick();
  const list=getLeaderboard();
  const ul=document.getElementById('leaderboardList');
  if(list.length===0){
    ul.innerHTML='<div class="empty-board"><div class="big">📭</div>还没有成绩哦<br>快去答题上榜吧！</div>';
  }else{
    const medals=['🥇','🥈','🥉'];
    ul.innerHTML=list.slice(0,10).map((item,i)=>`
      <li class="leaderboard-item ${i<3?'top'+(i+1):''}">
        <div class="lb-rank">${i<3?medals[i]:i+1}</div>
        <div class="lb-name">${escapeHtml(item.name)}<span class="lb-diff">${item.diff||''}</span></div>
        <div class="lb-score">${item.score}分</div>
      </li>
    `).join('');
  }
  document.getElementById('leaderboardModal').classList.add('show');
}
function closeLeaderboard(){sClick();document.getElementById('leaderboardModal').classList.remove('show')}
function clearLeaderboard(){
  if(confirm('确定要清空所有排行榜记录吗？')){localStorage.removeItem(LB_KEY);showLeaderboard()}
}
function escapeHtml(str){const d=document.createElement('div');d.textContent=str;return d.innerHTML}

// ==================== 重新开始 ====================
function restart(){
  sClick();
  document.getElementById('resultPage').style.display='none';
  document.getElementById('startPage').style.display='block';
  document.getElementById('lives').textContent='❤️❤️❤️';
  hideCombo();
}

// ==================== 海报 ====================
function showPoster(){
  sClick();
  const canvas=document.getElementById('posterCanvas');
  const ctx=canvas.getContext('2d');
  const W=600,H=800;
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#667eea');grad.addColorStop(0.5,'#764ba2');grad.addColorStop(1,'#f093fb');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.1)';
  ctx.beginPath();ctx.arc(80,120,60,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(520,680,80,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(550,100,40,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';roundRect(ctx,60,140,480,560,30);ctx.fill();
  ctx.fillStyle='#333';ctx.font='bold 36px Microsoft YaHei';ctx.textAlign='center';
  ctx.fillText('🎯 欢乐答题大挑战',300,210);
  ctx.fillStyle='#667eea';ctx.font='bold 72px Microsoft YaHei';
  ctx.fillText(score+'分',300,310);
  const rankText=document.getElementById('rankBadge').textContent;
  ctx.fillStyle='#999';ctx.font='20px Microsoft YaHei';
  ctx.fillText(rankText,300,355);
  ctx.fillStyle='#666';ctx.font='18px Microsoft YaHei';
  ctx.fillText(`答对 ${correctCount}/${questions.length} 题 · 最高 ${maxCombo} 连击`,300,410);
  ctx.fillText(`难度：${currentDiff==='easy'?'🌱 简单':currentDiff==='medium'?'🔥 中等':'💀 困难'}`,300,445);
  if(achievements.length>0){
    ctx.fillStyle='#333';ctx.font='bold 18px Microsoft YaHei';
    ctx.fillText('🏅 获得成就',300,500);
    ctx.font='15px Microsoft YaHei';ctx.fillStyle='#ff8c00';
    achievements.forEach((a,i)=>{ctx.fillText(`${a.icon} ${a.name}`,300,535+i*28)});
  }
  ctx.fillStyle='#fff';ctx.font='16px Microsoft YaHei';
  ctx.fillText('扫码来挑战，看你能拿多少分！',300,740);
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='12px Microsoft YaHei';
  ctx.fillText('欢乐答题大挑战 · 等你来战',300,770);
  document.getElementById('posterModal').classList.add('show');
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function downloadPoster(){
  const canvas=document.getElementById('posterCanvas');
  const link=document.createElement('a');
  link.download='答题成绩.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
}
function closePoster(){document.getElementById('posterModal').classList.remove('show')}
document.getElementById('leaderboardModal').addEventListener('click',e=>{if(e.target.id==='leaderboardModal')closeLeaderboard()});
document.getElementById('posterModal').addEventListener('click',e=>{if(e.target.id==='posterModal')closePoster()});
</script>
